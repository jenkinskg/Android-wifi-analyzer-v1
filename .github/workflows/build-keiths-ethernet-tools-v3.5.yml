name: Build Keith's Ethernet Tools Android v3.5
on:
  push:
    branches:
      - keiths-ethernet-tools-android-v3.5
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: KeithsEthernetToolsAndroid
        run: gradle --no-daemon assembleDebug
      - name: Check generated APK
        run: test -s KeithsEthernetToolsAndroid/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Keiths-Ethernet-Tools-Android-v3.5-APK
          path: KeithsEthernetToolsAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
