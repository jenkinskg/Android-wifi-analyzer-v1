name: SwitchFinder Android USB Diagnostic APK
on:
  push:
    branches:
      - switchfinder-usb-diagnostic
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchfinder-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android diagnostic APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchFinder-Android-USB-Diagnostic-APK
          path: switchfinder-android/app/build/outputs/apk/debug/app-debug.apk
