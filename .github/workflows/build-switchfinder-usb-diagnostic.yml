name: SwitchFinder Android USB Diagnostic APK
on:
  push:
    branches:
      - switchfinder-usb-diagnostic
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchfinder-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android diagnostic APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchFinder-Android-USB-Diagnostic-APK
          path: switchfinder-android/app/build/outputs/apk/debug/app-debug.apk
