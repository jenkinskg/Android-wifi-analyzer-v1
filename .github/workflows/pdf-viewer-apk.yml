name: Build PDF Viewer APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'PDF-Viewer/**'
      - '.github/workflows/pdf-viewer-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PDF-Viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Viewer-v1.0-APK
          path: PDF-Viewer/app/build/outputs/apk/debug/app-debug.apk
