name: Sidekick Android APK
on:
  push:
    branches: [sidekick-jpg-survey]
    paths:
      - 'SidekickSurveyAndroid/**'
      - '.github/workflows/sidekick-survey-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: SidekickSurveyAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sidekick-Survey-Android-v0.9-Debug-APK
          path: SidekickSurveyAndroid/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download APK to repository
        if: github.ref == 'refs/heads/sidekick-jpg-survey'
        run: |
          mkdir -p ../apks
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/Sidekick-Survey-Android-v0.9.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apks/Sidekick-Survey-Android-v0.9.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Sidekick Survey Android installable APK [skip ci]"
            git push origin HEAD:sidekick-jpg-survey
          fi
