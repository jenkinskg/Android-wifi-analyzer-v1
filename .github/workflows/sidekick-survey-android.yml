name: Sidekick Android APK
on:
  push:
    branches: [sidekick-jpg-survey]
    paths:
      - 'SidekickSurveyAndroid/**'
      - '.github/workflows/sidekick-survey-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SidekickSurveyAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sidekick-Survey-Android-Debug-APK
          path: SidekickSurveyAndroid/app/build/outputs/apk/debug/app-debug.apk
