name: Build URL to MP3 APK
on:
  push:
    branches: [url-to-mp3-v3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Extract native BitTorrent library ARM64
        working-directory: URL-to-MP3
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath
          JAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.libtorrent4j/libtorrent4j-android-arm64/2.1.0-39" -name '*.jar' | head -1)"
          test -s "$JAR"
          unzip -Z1 "$JAR"
          ENTRY="$(unzip -Z1 "$JAR" | grep 'libtorrent4j.so' | head -1)"
          test -n "$ENTRY"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -p "$JAR" "$ENTRY" > app/src/main/jniLibs/arm64-v8a/libtorrent4j.so
          test -s app/src/main/jniLibs/arm64-v8a/libtorrent4j.so
      - name: Build APK
        working-directory: URL-to-MP3
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: URL-to-MP3-v3-APK
          path: URL-to-MP3/app/build/outputs/apk/debug/app-debug.apk
