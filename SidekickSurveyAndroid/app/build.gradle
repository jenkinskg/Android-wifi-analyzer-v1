plugins { id 'com.android.application' }

android {
    namespace 'com.jenkinskg.sidekicksurvey'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jenkinskg.sidekicksurvey.v9'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9-stop-go-5-second'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
