plugins { id 'com.android.application' }

android {
    namespace 'com.jenkinskg.sidekicksurvey'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jenkinskg.sidekicksurvey.v5'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5-per-point-closest-ap'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
