plugins { id 'com.android.application' }

android {
    namespace 'com.jenkinskg.sidekicksurvey'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jenkinskg.sidekicksurvey.v7'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-aruba-ap-inventory'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
