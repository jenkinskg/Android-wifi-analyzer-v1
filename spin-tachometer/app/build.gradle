plugins {
    id 'com.android.application'
}
android {
    namespace 'com.jenkinskg.spintach'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jenkinskg.spintach'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
